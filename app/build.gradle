plugins {
    id 'com.android.application'
}
def xdBuildCode = (providers.gradleProperty('xdBuildCode').orElse('1').get()) as int
def xdBuildName = providers.gradleProperty('xdBuildName').orElse('0.1.0').get()
android {
    namespace 'com.chasmet.xdebt'
    compileSdk 34
    defaultConfig {
        applicationId 'com.chasmet.xdebt'
        minSdk 21
        targetSdk 34
        versionCode xdBuildCode
        versionName xdBuildName
    }
    signingConfigs {
        release {
            if (System.getenv('XDEBT_KEYSTORE_PATH')) {
                storeFile file(System.getenv('XDEBT_KEYSTORE_PATH'))
                storePassword System.getenv('XDEBT_STORE_PASSWORD')
                keyAlias System.getenv('XDEBT_KEY_ALIAS')
                keyPassword System.getenv('XDEBT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // A debug APK must never overwrite an existing signed XDebt install.
            applicationIdSuffix '.dev'
            versionNameSuffix '-test'
        }
        release {
            minifyEnabled false
            if (System.getenv('XDEBT_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
