name: XDebt Android - APK et AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      XDEBT_KEYSTORE_B64: ${{ secrets.XDEBT_KEYSTORE_B64 }}
      XDEBT_STORE_PASSWORD: ${{ secrets.XDEBT_STORE_PASSWORD }}
      XDEBT_KEY_ALIAS: ${{ secrets.XDEBT_KEY_ALIAS }}
      XDEBT_KEY_PASSWORD: ${{ secrets.XDEBT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure canonical Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Persist complete Gradle wrapper once
        run: |
          if ! git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            git commit -m "build: check in canonical Gradle wrapper" || true
            git push origin HEAD:main
          fi
      - name: Assemble debug APK
        run: ./gradlew assembleDebug -PversionCode=$((1000 + GITHUB_RUN_NUMBER)) -PversionName=1.0.${GITHUB_RUN_NUMBER}
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XDebt-debug-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Configure long-term signing key
        if: env.XDEBT_KEYSTORE_B64 != ''
        run: |
          echo "$XDEBT_KEYSTORE_B64" | base64 --decode > signing.jks
          echo "XDEBT_KEYSTORE_PATH=${GITHUB_WORKSPACE}/signing.jks" >> "$GITHUB_ENV"
      - name: Assemble signed APK and Play Store AAB
        if: env.XDEBT_KEYSTORE_B64 != ''
        run: ./gradlew assembleRelease bundleRelease -PversionCode=$((1000 + GITHUB_RUN_NUMBER)) -PversionName=1.0.${GITHUB_RUN_NUMBER}
      - name: Create signed GitHub Release
        if: env.XDEBT_KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${GITHUB_RUN_NUMBER}"             app/build/outputs/apk/release/app-release.apk             app/build/outputs/bundle/release/app-release.aab             --title "XDebt v1.0.${GITHUB_RUN_NUMBER}"             --notes "Version de développement. Paiements désactivés."
