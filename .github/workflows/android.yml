name: XDebt Android APK, AAB et mises à jour intégrées

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xdebt-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      XDEBT_KEYSTORE_B64: ${{ secrets.XDEBT_KEYSTORE_B64 }}
      XDEBT_STORE_PASSWORD: ${{ secrets.XDEBT_STORE_PASSWORD }}
      XDEBT_KEY_ALIAS: ${{ secrets.XDEBT_KEY_ALIAS }}
      XDEBT_KEY_PASSWORD: ${{ secrets.XDEBT_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Platform API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Calculate version
        id: version
        run: |
          echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build debug APK (test only)
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PxdBuildCode=${{ steps.version.outputs.code }} \
            -PxdBuildName=${{ steps.version.outputs.name }}

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: XDebt-debug-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check long-term signing configuration
        if: github.event_name != 'pull_request'
        id: signing
        shell: bash
        run: |
          if [[ -n "$XDEBT_KEYSTORE_B64" && -n "$XDEBT_STORE_PASSWORD" &&
                -n "$XDEBT_KEY_ALIAS" && -n "$XDEBT_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed release is disabled until all four XDEBT signing secrets are configured."
          fi

      - name: Restore private signing keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          umask 077
          printf '%s' "$XDEBT_KEYSTORE_B64" | base64 --decode > signing.jks
          echo "XDEBT_KEYSTORE_PATH=${GITHUB_WORKSPACE}/signing.jks" >> "$GITHUB_ENV"

      - name: Build stable signed APK and Play AAB
        if: steps.signing.outputs.ready == 'true'
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PxdBuildCode=${{ steps.version.outputs.code }} \
            -PxdBuildName=${{ steps.version.outputs.name }}

      - name: Verify output signatures and version
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          test -s app/build/outputs/bundle/release/app-release.aab
          mkdir -p release-assets
          cp "$APK" "release-assets/XDebt-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "release-assets/XDebt-v${{ steps.version.outputs.name }}.aab"
          cd release-assets
          sha256sum "XDebt-v${{ steps.version.outputs.name }}.apk" > "XDebt-v${{ steps.version.outputs.name }}.apk.sha256"

      - name: Publish signed GitHub Release for in-app updates
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            "release-assets/XDebt-v${{ steps.version.outputs.name }}.apk" \
            "release-assets/XDebt-v${{ steps.version.outputs.name }}.apk.sha256" \
            "release-assets/XDebt-v${{ steps.version.outputs.name }}.aab" \
            --title "XDebt v${{ steps.version.outputs.name }}" \
            --notes "Mise à jour intégrée Android. Même clé de signature. Aucun paiement activé. Installez les versions Google Play depuis Google Play."

      - name: Remove ephemeral keystore
        if: always()
        run: rm -f signing.jks
